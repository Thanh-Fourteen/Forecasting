# SINH TỰ ĐỘNG bởi tools/sinh_nen.py — KHÔNG SỬA TAY. Sửa buoi-30/lab/nen.toml hoặc tools/nen/phien-ban.toml rồi chạy lại tool.

[project]
name = "buoi-30-nen"
version = "0.0.0"
description = "Môi trường chốt phiên bản của buoi-30 (thư viện trợ giúp: tv/)"
requires-python = "==3.12.*"
dependencies = [
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "mlforecast==1.1.0",
    "neuralforecast==3.2.2",
    "numpy==2.5.3",
    "pandas==2.3.3",
    "statsforecast==2.1.1",
    "torch==2.14.0",
    "tzdata==2026.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]
notebook = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-09-17T00:00:00Z"
default-groups = ["dev", "notebook"]

[tool.uv.build-backend]
module-name = "tv"
module-root = ""

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
