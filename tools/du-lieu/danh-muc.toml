# Danh mục GỐC mọi bộ dữ liệu của khoá — nguồn của lab/00-nen/du-lieu.toml của từng buổi và của
# phu-luc/F-nguon-du-lieu.md (sinh bằng tools/du-lieu/sinh_phu_luc_f.py). Nhật ký rà giấy phép: NGHIEN-CUU.md.
#
# Mỗi bộ là một bảng [bo.<ten>]. Trường:
#   kieu            http | hf | kaggle | eia | openaq            (xem tools/lay_du_lieu.py)
#   tieu_de         tên đầy đủ
#   url             URL gốc (http)            url_mirror  bản mirror HF chốt commit (chỉ khi mirror = true)
#   repo, revision, duong_dan                 (hf — revision là commit sha 40 ký tự)
#   kaggle          "competition:<slug>" | "dataset:<owner>/<slug>" + tep_sha256 = { tệp = sha256 }
#   route, tham_so  (eia)                     duong_dan, tham_so  (openaq)
#   sha256          sha256 của tệp tải về (bắt buộc, trừ kaggle dùng tep_sha256, bộ truc_tiep, bộ cho_sha256)
#   cho_sha256      lý do chưa chốt sha256 — được ở danh mục nhưng sinh_nen từ chối đưa vào buổi
#   dung_luong      byte
#   giai_nen        zip | tar.gz | gz | …      chi_lay  tệp cần trong tệp nén      giai_nen_long  tệp nén lồng
#   ten_tep         tên lưu khi không giải nén
#   giay_phep, link_giay_phep, trang_nguon, ghi_nguon — giấy phép ĐÃ ĐỌC từ trang gốc
#   trich_giay_phep trích NGUYÊN VĂN điều khoản cho phân phối lại / sử dụng
#   mirror          true nếu giấy phép cho phân phối lại bản sao; ly_do_mirror nếu cần giải thích
#   du_phong        bộ mở thay thế — bắt buộc với bộ bị hạn chế
#   khoang_thoi_gian ["bắt đầu", "kết thúc"] cố định   (khong_thoi_gian = true nếu không phải chuỗi thời gian)
#   dang_dai        cách tv.du_lieu.doc_du_lieu đưa về unique_id, ds, y (tuỳ chọn)
#   truc_tiep       true chỉ cho bài dự báo trực tiếp (kèm ly_do_truc_tiep) — bỏ kiểm sha256
#   buoi            các buổi dùng (tra cứu)       ghi_chu    lưu ý khi dùng
#   xac_minh        ngày đọc trang giấy phép + tải thử
#
# [ngoai_danh_muc.<ten>]: nguồn có trong lộ trình nhưng KHÔNG tải tự động (giấy phép / không có giấy phép).

