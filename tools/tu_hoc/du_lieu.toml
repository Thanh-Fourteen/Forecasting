# Mô tả bộ dữ liệu cho notebook tự học — nguồn của mục "Bộ dữ liệu" mà `nb.du_lieu()` tự chèn vào phần 0.
#
# Viết MỘT lần cho mỗi bộ; mọi buổi dùng bộ đó dùng lại. Khoá là tên bộ trong tools/du-lieu/danh-muc.toml, hoặc
# mẫu có dấu * cho một họ bộ (vd "binance-btcusdt-1h-*": nhiều tháng chung một mô tả).
# Nguồn trích dẫn, giấy phép, dung lượng tải lấy tự động từ danh mục — không chép lại ở đây.
#
#   ten         tên bộ dữ liệu (thường là tên gốc tiếng Anh)
#   gioi_thieu  2–4 câu, giọng kể: ai thu, thu cái gì, ở đâu, khoảng thời gian, mỗi dòng là gì, tệp gồm những gì
#   [<khoá>.cot]  cột → nghĩa (theo thứ tự hiện ra trong bảng); chỉ các cột buổi học dùng hoặc dễ gây thắc mắc
#
# Thiếu mô tả cho một bộ mà buổi dùng → `python tools/tu_hoc/sinh.py N` dừng và báo khoá cần thêm.

