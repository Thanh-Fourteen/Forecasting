# SINH TỰ ĐỘNG bởi tools/sinh_nen.py — KHÔNG SỬA TAY. Sửa buoi-24/lab/nen.toml hoặc tools/nen/phien-ban.toml rồi chạy lại tool.

[project]
name = "buoi-24-nen"
version = "0.0.0"
description = "Môi trường chốt phiên bản của buoi-24 (thư viện trợ giúp: tv/)"
requires-python = "==3.12.*"
dependencies = [
    "autogluon.timeseries==1.6.2",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "statsforecast==2.0.3",
    "torch==2.10.0",
    "tzdata==2026.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]
notebook = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-09-17T00:00:00Z"
constraint-dependencies = [
    "coreforecast==0.0.16",
    "mlforecast==0.14.0",
    "scipy==1.15.3",
    "utilsforecast==0.2.11",
]
default-groups = ["dev", "notebook"]

[tool.uv.build-backend]
module-name = "tv"
module-root = ""

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
